---
# Pre-commit hooks for the hybrid Proxmox infrastructure project.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.89.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      # terraform_tflint volontairement désactivé en pré-commit : il exige le
      # binaire `tflint` localement et un `tflint --init` (téléchargement de
      # plugins). Couverture déjà assurée par .github/workflows/terraform.yml
      # job `tflint (terraform/<site>)`.

  # ansible-lint volontairement désactivé en pré-commit : le hook tourne
  # dans un venv isolé qui ne voit pas les collections galaxy installées
  # via `ansible/requirements.yml`, ce qui produit des faux positifs
  # `syntax-check[unknown-module]` à chaque commit. Couverture déjà
  # assurée par `.github/workflows/ansible.yml` (job `lint` qui installe
  # les collections d'abord, puis `syntax-check` matrix par site).
  # Pour lancer ansible-lint en local : `cd ansible && ansible-lint`.

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--config=.markdownlint.yml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
