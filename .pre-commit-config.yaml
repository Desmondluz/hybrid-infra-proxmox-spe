---
# Pre-commit hooks for the hybrid Proxmox infrastructure project.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.89.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      # terraform_tflint volontairement désactivé en pré-commit : il exige le
      # binaire `tflint` localement et un `tflint --init` (téléchargement de
      # plugins). Couverture déjà assurée par .github/workflows/terraform.yml
      # job `tflint (terraform/<site>)`. Réactiver ici si on veut bloquer en
      # local ; sinon laisser la CI faire foi.

  - repo: https://github.com/ansible/ansible-lint
    rev: v24.2.0
    hooks:
      - id: ansible-lint
        files: ^(ansible/|\.github/workflows/ansible\.yml)
        # ansible-lint a besoin d'ansible-core pour parser les playbooks ;
        # le pin doit rester compatible avec requirements-dev.txt.
        additional_dependencies:
          - "ansible-core>=2.16,<2.17"

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--config=.markdownlint.yml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
