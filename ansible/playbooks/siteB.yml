---
# Playbook d'orchestration Site B (remote).
# Applique : common → pfSense (DMZ + NAT bastion) → OpenVPN client →
#            bastion durci → DNS forwarder → forwarder de logs.

- name: "[Site B] Durcissement commun Linux"
  hosts: siteB:&linux
  become: true
  roles:
    - role: common
    - role: filebeat

- name: "[Site B] Configuration pfSense"
  hosts: siteB:&pfsense
  gather_facts: false
  roles:
    - role: pfsense
      vars:
        pfsense_role: "client-side"

- name: "[Site B] OpenVPN client"
  hosts: siteB:&pfsense
  gather_facts: false
  roles:
    - role: openvpn
      vars:
        openvpn_mode: "client"

- name: "[Site B] DNS forwarder"
  hosts: siteB:&pfsense
  gather_facts: false
  roles:
    - role: dns-forwarder
      vars:
        dns_peer_ip: "{{ dns_forward_to_siteA }}"
        dns_peer_zone: "s1.lan"

- name: "[Site B] Bastion durci (MFA + auditd + SSH hardening)"
  hosts: siteB:&bastion
  become: true
  roles:
    - role: bastion

- name: "[Site B] Services — log forwarder / app miroir"
  hosts: siteB:&services
  become: true
  roles:
    - role: filebeat
      vars:
        filebeat_role: "forwarder"
