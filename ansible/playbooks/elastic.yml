---
- name: "Observabilité — Elastic stack (Site A)"
  hosts: siteA:&observability
  become: true
  roles:
    - role: common
    - role: elasticsearch
    - role: kibana
    - role: logstash

- name: "Observabilité — Filebeat / Metricbeat partout"
  hosts: siteA:&linux:siteB:&linux
  become: true
  roles:
    - role: filebeat
