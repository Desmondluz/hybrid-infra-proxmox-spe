# Filter OpenVPN — handshake, reneg, down
filter {
  if [type] == "syslog" and [program] == "openvpn" {
    grok {
      match => { "msg" => [
        "%{DATA:ovpn_peer}/%{IP:ovpn_peer_ip}:%{INT:ovpn_peer_port} %{GREEDYDATA:ovpn_event}",
        "Initialization Sequence Completed",
        "SIGTERM\\[soft,.*\\] received, process exiting"
      ] }
      tag_on_failure => ["_grokparsefailure_openvpn"]
    }
    mutate {
      add_field => { "[event][module]" => "openvpn" }
      add_field => { "[event][dataset]" => "openvpn.events" }
    }
    if "Initialization Sequence Completed" in [msg] {
      mutate { add_tag => ["vpn_up"] }
    }
  }
}
