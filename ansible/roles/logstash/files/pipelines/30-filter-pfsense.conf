# Filter pfSense — filterlog (CSV), SSH, OpenVPN
filter {
  if [type] == "syslog" and "pfsense" in [host][name] {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:syslog_ts} %{SYSLOGHOST:syslog_host} %{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:msg}"
      }
      tag_on_failure => ["_grokparsefailure_pfsense_header"]
    }

    if [program] == "filterlog" {
      csv {
        source => "msg"
        separator => ","
        columns => [
          "rule","sub_rule","anchor","tracker","iface","reason","action","direction",
          "ip_version","tos","ecn","ttl","id","offset","flags","proto_num","proto",
          "length","src_ip","dst_ip","src_port","dst_port","data_length","tcp_flags"
        ]
      }
      mutate {
        add_field => { "[event][module]" => "pfsense" }
        add_field => { "[event][dataset]" => "pfsense.firewall" }
      }
      if [action] == "block" {
        mutate { add_tag => ["blocked"] }
      }
    }
  }
}
