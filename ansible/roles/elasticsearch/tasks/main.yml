---
# Role: elasticsearch — déploie un Elasticsearch single-node en APT.
# Couvre : log_centralisation, log_observability.

- name: "[elastic] Ajouter la clé GPG Elastic"
  ansible.builtin.apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present

- name: "[elastic] Ajouter le repo Elastic 8.x"
  ansible.builtin.apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present
    filename: elastic-8.x

- name: "[elastic] Installer Elasticsearch"
  ansible.builtin.apt:
    name: elasticsearch
    state: present
    update_cache: yes

- name: "[elastic] Configurer elasticsearch.yml"
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0660"
  notify: restart elasticsearch

- name: "[elastic] jvm.options — sizing"
  ansible.builtin.copy:
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    owner: root
    group: elasticsearch
    mode: "0660"
    content: |
      -Xms{{ elastic_heap | default('2g') }}
      -Xmx{{ elastic_heap | default('2g') }}
  notify: restart elasticsearch

- name: "[elastic] Démarrer au boot et maintenant"
  ansible.builtin.service:
    name: elasticsearch
    state: started
    enabled: true

- name: "[elastic] Attendre que l'API réponde"
  ansible.builtin.uri:
    url: "http://127.0.0.1:9200/_cluster/health"
    user: elastic
    password: "{{ elastic_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: es_ready
  until: es_ready.status == 200
  retries: 30
  delay: 10

- name: "[elastic] ILM policy — retention 30 jours par défaut"
  ansible.builtin.uri:
    url: "http://127.0.0.1:9200/_ilm/policy/cia-30d"
    method: PUT
    user: elastic
    password: "{{ elastic_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      policy:
        phases:
          hot: { actions: {} }
          delete:
            min_age: "30d"
            actions: { delete: {} }
    status_code: [200, 201]
