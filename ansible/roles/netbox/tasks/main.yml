---
# Role: netbox — IPAM (NetBox 4.x) déployé via Docker compose + Caddy.
# Source de vérité : networking/addressing.yml.
# Couvre les critères : network_ipam, network_segmentation (preuves), bonus_advanced_monitoring.
#
# Découpage en 2 sub-playbooks pour permettre exécution sélective via tags :
#   - install.yml  (tag: netbox-install) — déploiement Docker + NetBox + Caddy
#   - seed.yml     (tag: netbox-sync)    — import du plan d'adressage
#
# Exemples :
#   # Première installation complète :
#   ansible-playbook playbooks/siteA.yml --tags netbox
#
#   # Re-sync après modification de addressing.yml (sans réinstaller) :
#   ansible-playbook playbooks/siteA.yml --tags netbox-sync
#
#   # Réinstallation Docker seul (debug) :
#   ansible-playbook playbooks/siteA.yml --tags netbox-install

- name: "[netbox] Phase 1 — Install Docker + NetBox + Caddy"
  ansible.builtin.import_tasks: install.yml
  when: netbox_install_enabled | bool
  tags: [netbox, netbox-install]

- name: "[netbox] Phase 2 — Seed depuis addressing.yml"
  ansible.builtin.import_tasks: seed.yml
  when: netbox_seed_enabled | bool
  tags: [netbox, netbox-sync]
