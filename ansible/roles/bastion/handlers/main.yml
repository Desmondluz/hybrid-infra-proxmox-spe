---
- name: restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: restart auditd
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted
