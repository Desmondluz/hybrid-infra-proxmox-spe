name: ansible

on:
  push:
    branches: [main, develop]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ansible-lint + yamllint)
    runs-on: ubuntu-22.04
    # ANSIBLE_ROLES_PATH et ANSIBLE_COLLECTIONS_PATH sont absolus pour
    # contourner la logique par défaut d'ansible-lint qui préfixe le
    # playbook_dir (`ansible/playbooks/roles/` au lieu de `ansible/roles/`).
    env:
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/ansible/.ansible/collections
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: install collections
        run: |
          ansible-galaxy collection install \
            -r ansible/requirements.yml \
            -p ansible/.ansible/collections
      - name: yamllint
        run: yamllint -c .yamllint.yml ansible/
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint --force-color

  syntax:
    name: syntax-check (${{ matrix.site }})
    runs-on: ubuntu-22.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        site: [siteA, siteB]
    env:
      ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/ansible/.ansible/collections
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ansible-galaxy collection install \
            -r ansible/requirements.yml \
            -p ansible/.ansible/collections
      - name: syntax-check playbooks
        working-directory: ansible
        run: |
          ansible-playbook \
            -i inventories/${{ matrix.site }}.ini \
            playbooks/${{ matrix.site }}.yml \
            --syntax-check
      - name: syntax-check vpn & killswitch
        working-directory: ansible
        run: |
          for pb in vpn.yml killswitch.yml site.yml; do
            ansible-playbook -i inventories/${{ matrix.site }}.ini "playbooks/${pb}" --syntax-check
          done
