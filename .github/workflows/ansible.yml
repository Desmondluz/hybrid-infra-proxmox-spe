name: ansible

on:
  push:
    branches: [main, develop]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ansible-lint + yamllint)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install tools
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==2.16.*" "ansible-lint==24.*" "yamllint==1.35.*"
      - name: install collections
        run: ansible-galaxy install -r ansible/requirements.yml
      - name: yamllint
        run: yamllint -c .yamllint.yml ansible/
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint --force-color

  syntax:
    name: syntax-check (${{ matrix.site }})
    runs-on: ubuntu-22.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        site: [siteA, siteB]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install tools
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core==2.16.*"
          ansible-galaxy install -r ansible/requirements.yml
      - name: syntax-check playbooks
        working-directory: ansible
        run: |
          ansible-playbook \
            -i inventories/${{ matrix.site }}.ini \
            playbooks/${{ matrix.site }}.yml \
            --syntax-check
      - name: syntax-check vpn & killswitch
        working-directory: ansible
        run: |
          for pb in vpn.yml killswitch.yml site.yml; do
            ansible-playbook -i inventories/${{ matrix.site }}.ini "playbooks/${pb}" --syntax-check
          done
