name: Quality

on:
  push:
    branches:
      - main

jobs:
  trufflesec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.63.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
