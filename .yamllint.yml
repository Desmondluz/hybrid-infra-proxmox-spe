---
extends: default

rules:
  line-length:
    max: 160
    level: warning
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no']
  indentation:
    spaces: 2
    indent-sequences: true
  braces:
    max-spaces-inside: 1

ignore: |
  .github/
  .ansible/
  **/node_modules/
  **/.terraform/
  # Fichiers chiffrés par SOPS — leur structure est imposée par le format
  # cipher (lignes ENC[…] arbitrairement longues, indentation non standard).
  secrets/
  **/*.enc.yml
  **/*.sops.yml
  **/*.sops.yaml
