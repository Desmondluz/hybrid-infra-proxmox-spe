# ==========================================================================
# OpenVPN client — Site B (remote)
# Se connecte au serveur Site A sur WAN TCP/443 (OpenVPN-over-HTTPS pattern,
# traverse les firewalls périmétriques école/entreprise qui bloquent UDP).
# Référence: networking/vpn-topology.yml + docs/runbooks/vpn.md §1bis
# ==========================================================================

client
dev tun
proto tcp-client
remote vpn.siteA.example.com 443
# fallback DNS : remote <IP_PUBLIQUE_SITE_A> 443
resolv-retry infinite
nobind

# IP fixe côté tunnel (172.16.0.2)
ifconfig 172.16.0.2 255.255.255.252

# PKI
ca         /etc/openvpn/ca.crt
cert       /etc/openvpn/client-siteB.crt
key        /etc/openvpn/client-siteB.key    # keep secret (mode 0400)
tls-crypt  /etc/openvpn/tls-crypt.key

# Cryptographie (doit matcher le serveur)
cipher AES-256-GCM
data-ciphers AES-256-GCM
auth SHA256
tls-version-min 1.2
tls-cipher TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384

# Vérification stricte du nom de cert serveur
remote-cert-tls server
verify-x509-name "CN=cia-vpn-server-siteA" subject

# Hygiène
persist-key
persist-tun
keepalive 10 60
reneg-sec 3600
user nobody
group nogroup

# Pas de redirect-gateway : on ne veut PAS router tout le trafic Internet
# dans le tunnel — uniquement les réseaux CIA (routes poussées par le server).
pull-filter accept "route 10.10."
pull-filter ignore "redirect-gateway"
pull-filter ignore "dhcp-option DNS"

# Logs
status       /var/log/openvpn/status.log 30
log-append   /var/log/openvpn/openvpn.log
verb 4
mute 20
