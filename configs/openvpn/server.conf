# ==========================================================================
# OpenVPN server — Site A (on-prem)
# Topology: site-to-site, tun, point-to-point on 172.16.0.0/30
# Référence: networking/vpn-topology.yml
# ==========================================================================
# Côté pfSense, ce fichier sert de spec auditable : le paramétrage réel est
# appliqué via l'API pfSense par la tâche ansible openvpn/tasks/main.yml.
# Il peut aussi être utilisé tel quel par un daemon OpenVPN standard sur
# Linux pour un test hors pfSense.

# Rôle et transport
mode server
tls-server
dev tun
proto udp
port 1194

# Topologie point-à-point (pas de subnet partagé)
topology subnet
server 172.16.0.0 255.255.255.252
# 172.16.0.1 = server (Site A) ; 172.16.0.2 = client (Site B)
ifconfig-pool-persist /var/log/openvpn/ipp.txt

# Routes poussées vers le client (Site B) — LAN + admin Site A
push "route 10.10.0.0 255.255.255.0"
push "route 10.10.10.0 255.255.255.0"

# Routes locales vers le LAN du client (Site B) — apprises côté server
route 192.168.0.0 255.255.255.0
route 192.168.10.0 255.255.255.0

# Directive CCD — épingle l'IP du client
client-config-dir /etc/openvpn/ccd
client-to-client

# PKI
ca        /etc/openvpn/ca.crt
cert      /etc/openvpn/server.crt
key       /etc/openvpn/server.key          # keep secret (mode 0400)
dh        /etc/openvpn/dh2048.pem
crl-verify /etc/openvpn/crl.pem
tls-crypt /etc/openvpn/tls-crypt.key        # shared static key, auth layer

# Cryptographie (exigence audit : AES-256-GCM + SHA256 + TLS 1.2+)
cipher AES-256-GCM
data-ciphers AES-256-GCM
auth SHA256
tls-version-min 1.2
tls-cipher TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384

# Hygiène
persist-key
persist-tun
keepalive 10 60
reneg-sec 3600
user nobody
group nogroup

# Logs — filebeat les expédiera vers Logstash
status       /var/log/openvpn/status.log 30
log-append   /var/log/openvpn/openvpn.log
verb 4
mute 20
