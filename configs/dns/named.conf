// ==========================================================================
// Référence BIND9 pour la résolution CIA (équivalent conceptuel de l'unbound
// déployé). Ce fichier n'est PAS chargé directement : il sert de spec auditable
// et peut être appliqué sur un BIND de secours.
//
// Le déploiement réel utilise unbound :
//   ansible/roles/dns-forwarder/templates/cia.conf.j2
// ==========================================================================

options {
    directory "/var/cache/bind";
    recursion yes;

    // ACL : LAN Site A + admin A, LAN Site B + services B, tunnel VPN, localhost
    allow-query { cia-internal; };

    // Upstreams publics — utilisés uniquement via pfSense (sortie contrôlée)
    forwarders {
        1.1.1.1;
        9.9.9.9;
    };
    forward only;

    dnssec-validation auto;
    listen-on { 127.0.0.1; 10.10.0.10; 192.168.0.10; };
    listen-on-v6 { none; };
};

acl cia-internal {
    127.0.0.1;
    10.10.0.0/24;
    10.10.10.0/24;
    172.16.0.0/30;
    192.168.0.0/24;
    192.168.10.0/24;
};

// ---------- Zone d'autorité : s1.lan ----------
zone "s1.lan" {
    type master;
    file "/etc/bind/db.s1.lan";
    allow-transfer { none; };
    notify no;
};

// ---------- Zone d'autorité : s2.lan ----------
zone "s2.lan" {
    type master;
    file "/etc/bind/db.s2.lan";
    allow-transfer { none; };
    notify no;
};

// ---------- Forward conditionnel vers l'autre site via VPN ----------
// Sur le résolveur Site A : forward s2.lan vers Site B
zone "s2.lan" {
    type forward;
    forward only;
    forwarders { 192.168.0.10; };
};

// Logging
logging {
    channel default_syslog {
        syslog daemon;
        severity info;
    };
    channel audit_channel {
        file "/var/log/named/audit.log" versions 7 size 10m;
        severity info;
        print-time yes;
    };
    category default { default_syslog; audit_channel; };
    category queries { audit_channel; };
};
