---
# Politique de sécurité réseau globale pour l’infrastructure hybride SPE
# Ce fichier décrit les règles de filtrage, la segmentation, les flux inter-sites,
# les accès autorisés, les restrictions, et les mécanismes de protection.
# Il ne dépend d’aucune technologie (pfSense, iptables, etc.) : c’est une vision
# purement fonctionnelle et architecturale.

siteA:
  description: >
    Site interne strictement privé. Aucun service n’est exposé à Internet.
    Le site A héberge les composants critiques (IPAM, DNS interne, supervision).
    La sécurité repose sur :
      - une séparation stricte LAN / Admin,
      - l’absence totale de sortie Internet directe,
      - l’obligation de passer par le VPN pour tout flux externe,
      - un modèle Zero Trust : tout est interdit sauf ce qui est explicitement autorisé.

  inbound:
    - id: A-IN-01
      action: allow
      from: "10.10.10.0/24 (admin)"
      to: "10.10.0.0/24 (lan)"
      ports: "any"
      description: >
        Autorise les administrateurs à accéder aux services internes du site A.
        Ce flux est essentiel pour la gestion des machines, du DNS, de NetBox
        et des services internes. Aucun autre réseau ne peut accéder au LAN.

    - id: A-IN-02
      action: allow
      from: "172.16.0.2 (siteB)"
      to: "10.10.0.0/24"
      ports: "any"
      description: >
        Autorise les flux provenant du site B via le tunnel VPN. Ce flux transporte :
          - supervision (probe → Elastic),
          - DNS forwarding,
          - synchronisation IPAM,
          - accès administrateur via bastion.
        Sans ce flux, les deux sites seraient isolés.

    - id: A-IN-03
      action: deny
      from: "any"
      to: "10.10.10.0/24 (admin)"
      description: >
        Protection du réseau d’administration. Seuls les administrateurs internes
        et le bastion (via VPN) peuvent y accéder. Empêche toute tentative d’accès
        non autorisé aux composants critiques.

  outbound:
    - id: A-OUT-01
      action: allow
      from: "10.10.0.0/24"
      to: "172.16.0.2"
      description: >
        Autorise le LAN du site A à joindre le site B via le VPN. Ce flux est
        nécessaire pour :
          - envoyer les logs vers Elastic,
          - accéder au bastion,
          - résoudre les DNS externes via le DNS du site B.

    - id: A-OUT-02
      action: deny
      from: "10.10.0.0/24"
      to: "internet"
      description: >
        Interdit toute sortie Internet directe. Le site A est totalement isolé
        d’Internet pour réduire la surface d’attaque. Toute communication externe
        doit passer par le site B.

  killswitch:
    - id: A-KS-01
      action: block
      from: "10.10.0.0/24"
      to: "any"
      condition: "vpn_down"
      description: >
        Si le tunnel VPN tombe, le site A doit être isolé immédiatement.
        Objectif :
          - empêcher toute fuite de trafic non chiffré,
          - éviter que le site A tente d’atteindre Internet,
          - garantir que les flux inter-sites ne passent jamais hors VPN.


siteB:
  description: >
    Site exposé à Internet. Il héberge :
      - le bastion (point d’entrée unique),
      - les services d’observabilité (Elastic),
      - le DNS secondaire.
    La sécurité repose sur :
      - une séparation LAN / Services,
      - un contrôle strict des flux entrants,
      - un accès administrateur centralisé via le bastion,
      - une protection renforcée des services critiques.

  inbound:
    - id: B-IN-01
      action: allow
      from: "internet"
      to: "192.168.0.10 (bastion)"
      ports: "22/tcp"
      description: >
        Autorise l’accès SSH au bastion depuis Internet. Le bastion est le seul
        point d’entrée externe vers l’infrastructure. Tous les accès administratifs
        doivent passer par lui.

    - id: B-IN-02
      action: allow
      from: "172.16.0.1 (siteA)"
      to: "192.168.10.20 (elastic)"
      ports: "9200-9300/tcp"
      description: >
        Autorise le site A à envoyer ses logs vers Elastic. Ce flux est essentiel
        pour l’observabilité centralisée et la détection d’incidents.

    - id: B-IN-03
      action: deny
      from: "any"
      to: "192.168.10.0/24 (services)"
      description: >
        Interdit tout accès direct aux services critiques. Seuls les flux explicitement
        autorisés (ex : logs depuis site A) sont permis.

  outbound:
    - id: B-OUT-01
      action: allow
      from: "192.168.0.10 (bastion)"
      to: "10.10.10.0/24 (admin siteA)"
      ports: "22/tcp"
      description: >
        Autorise le bastion à accéder aux machines administratives du site A.
        Ce flux est la base du modèle d’accès sécurisé : aucun administrateur
        ne peut accéder directement au site A.

    - id: B-OUT-02
      action: allow
      from: "192.168.10.20 (elastic)"
      to: "internet"
      ports: "443/tcp"
      description: >
        Autorise Elastic à télécharger des mises à jour et plugins. Flux sortant
        contrôlé et limité.

  killswitch:
    - id: B-KS-01
      action: block
      from: "192.168.0.0/24"
      to: "10.10.0.0/24"
      condition: "vpn_down"
      description: >
        Si le VPN tombe, le site B ne doit plus pouvoir joindre le site A.
        Empêche tout trafic inter-sites non chiffré.


dns_forwarding:
  description: >
    Les deux sites se relaient pour la résolution DNS. Le site A utilise le DNS
    du site B pour les requêtes externes, et le site B utilise le DNS du site A
    pour les zones internes. Tous les flux DNS passent par le VPN.

  rules:
    - id: DNS-01
      action: allow
      from: "10.10.10.30 (dnsA)"
      to: "192.168.0.30 (dnsB)"
      ports: "53/udp"
      description: "Forwarding DNS A → B via VPN."

    - id: DNS-02
      action: allow
      from: "192.168.0.30 (dnsB)"
      to: "10.10.10.30 (dnsA)"
      ports: "53/udp"
      description: "Forwarding DNS B → A via VPN."
